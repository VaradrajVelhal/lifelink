services:

  backend:
    build: ./backend
    container_name: lifelink_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/lifelink_db

    depends_on:
      db:
        condition: service_healthy

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000

  frontend:
    build: ./frontend
    container_name: lifelink_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  db:
    image: postgres:17
    container_name: lifelink_postgres

    environment:
      POSTGRES_DB: lifelink_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - lifelink_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifelink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lifelink_postgres_data: